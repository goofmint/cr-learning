language: ja
reviews:
  post_merge_actions:
    - enabled: true
      name: Slack通知
      prompt: マージが完了したら、Notionの更新履歴ページPRの概要と、PRのオープンからマージ完了までの時間を記述してください。日付ごとにグルーピングしてください。
  path_filters:
    - "!build/**"
    - "!.docusaurus/**"
    - "!node_modules/**"
    - "!package-lock.json"
  path_instructions:
    - path: "docs/**"
      instructions: |
        日本語の学習用ドキュメントです。以下の観点でレビューしてください。
        - 内部リンク・外部リンク・画像パスのリンク切れを検出する。
        - 見出し階層（h1→h2→h3）の飛びや乱れを指摘する。
        - 文体（です・ます調）と技術用語の表記を統一する。
        - コードサンプルの構文・整合性・実行可能性を検証する。
        - 初学者向けに分かりやすい記述か確認し、難解な技術用語には平易な説明を求める。
          一覧やコード例を活用し、理解しやすい構成になっているか確認する。
    - path: "i18n/en/**"
      instructions: |
        英訳ドキュメントです。以下の観点でレビューしてください。
        - 対応する日本語原文（docs/）と内容・見出し構造が一致し、訳し漏れがないか確認する。
        - 技術用語の訳語がドキュメント全体で一貫しているか確認する。
        - 直訳調でなく、英語として自然で読みやすい表現になっているか確認する。
        - リンク先・コードサンプルが原文と同等で壊れていないか確認する。
    - path: "**/*.{ts,tsx}"
      instructions: |
        Docusaurus（TypeScript）の設定・コンポーネントです。以下の観点でレビューしてください。
        - any/unknown の濫用や型定義の欠落がないか確認する。
        - docusaurus.config.ts / sidebars.ts の設定ミスやリンク切れ参照を確認する。
        - React コンポーネントの hooks 規則違反や不要な再レンダリングを指摘する。
        - alt 属性・aria ラベル・キーボード操作など WCAG 2.1 AA の観点を確認する。
knowledge_base:
  linked_repositories:
    - repository: goofmint/bookmark-demo
      instructions: ドキュメント内で参照しているデモアプリ
